<h2>{{ doc.event_name }}</h2>
<p>{{ doc.customer }} · {{ doc.event_date }} · {{ doc.venue }}</p>
<table>
  <thead><tr><th>Service</th><th>Qty</th><th>Rate</th><th>Amount</th></tr></thead>
  <tbody>
    {% for s in doc.services %}
    <tr><td>{{ s.description }}</td><td>{{ s.qty }}</td><td>{{ s.rate }}</td><td>{{ s.amount }}</td></tr>
    {% endfor %}
  </tbody>
</table>
<p><strong>Total: {{ doc.grand_total }}</strong> · Deposit required: {{ doc.deposit_required }}</p>
